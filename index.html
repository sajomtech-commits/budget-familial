<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Budget Familial — CCF</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fond: #0d0d1f;
    --carte: #16163a;
    --texte: #e8e8f0;
    --muted: #6a6a8a;
    --ccf-color: #54a0ff;
    --rose: #fd79a8;
    --bleu: #54a0ff;
    --vert: #53d769;
    --orange: #ffa502;
    --violet: #a29bfe;
    --cyan: #0fb9b1;
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--fond);
    color: var(--texte);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrapper {
    max-width: 500px;
    width: 100%;
    padding: 16px 12px 40px;
  }
  h1 {
    font-size: 1.2rem;
    text-align: center;
    background: linear-gradient(135deg, var(--ccf-color), var(--violet));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
    padding: 12px 0 4px;
  }
  .sub {
    text-align: center;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  /* CANVAS DIAGRAMME */
  .diagram-wrap {
    position: relative;
    width: 100%;
    max-width: 440px;
    margin: 0 auto 16px;
    aspect-ratio: 1 / 1.1;
  }
  #diagram {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* BULLE CCF */
  .ccf-bubble {
    fill: #1e2a5a;
    stroke: var(--ccf-color);
    stroke-width: 2;
    cursor: pointer;
    transition: stroke-width 0.2s;
  }
  .ccf-glow {
    fill: none;
    stroke: var(--ccf-color);
    stroke-width: 1;
    opacity: 0.2;
  }

  /* FLECHES */
  .flow-arrow {
    stroke: var(--muted);
    stroke-width: 1.5;
    fill: none;
    marker-end: url(#arrowhead);
    opacity: 0.7;
  }
  .flow-label {
    font-size: 9px;
    fill: var(--muted);
    text-anchor: middle;
    dominant-baseline: middle;
    font-weight: 600;
  }

  /* BULLES COMPTES */
  .bubble {
    cursor: pointer;
    transition: opacity 0.3s;
  }
  .bubble circle {
    stroke-width: 2.5;
    opacity: 0.9;
  }
  .bubble text.name {
    font-size: 9px;
    font-weight: 700;
    text-anchor: middle;
    fill: #fff;
    dominant-baseline: auto;
  }
  .bubble text.amount {
    font-size: 11px;
    font-weight: 800;
    text-anchor: middle;
    fill: #fff;
    dominant-baseline: hanging;
  }
  .bubble text.desc {
    font-size: 7px;
    text-anchor: middle;
    fill: rgba(255,255,255,0.5);
    dominant-baseline: hanging;
  }

  /* LÉGENDE REVENUS */
  .revenue-label {
    font-size: 8px;
    fill: var(--muted);
    text-anchor: middle;
    font-weight: 500;
  }
  .revenue-value {
    font-size: 10px;
    font-weight: 700;
    text-anchor: middle;
    fill: var(--vert);
  }
  .charge-label {
    font-size: 8px;
    fill: var(--muted);
    text-anchor: middle;
  }
  .charge-value {
    font-size: 10px;
    font-weight: 700;
    text-anchor: middle;
    fill: #ff6b81;
  }
  .reste-label {
    font-size: 8px;
    fill: var(--muted);
    text-anchor: middle;
  }
  .reste-value {
    font-size: 12px;
    font-weight: 800;
    text-anchor: middle;
    fill: var(--ccf-color);
  }

  /* PANEL EDITION */
  .edit-toggle {
    display: block;
    width: 100%;
    padding: 14px;
    background: var(--carte);
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 14px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 12px;
  }
  .edit-toggle:hover { border-color: var(--ccf-color); color: var(--ccf-color); }

  .edit-panel {
    display: none;
    background: var(--carte);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
    animation: slideDown 0.3s ease;
  }
  .edit-panel.open { display: block; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .edit-panel h3 {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .edit-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .edit-group label {
    display: block;
    font-size: 0.65rem;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .edit-group input {
    width: 100%;
    padding: 10px 12px;
    background: var(--fond);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: var(--texte);
    font-size: 0.85rem;
    outline: none;
    transition: border 0.2s;
  }
  .edit-group input:focus { border-color: var(--ccf-color); }
  .edit-full { grid-column: 1 / -1; }

  .edit-save {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--ccf-color), var(--violet));
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .edit-save:active { opacity: 0.8; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--vert);
    color: #000;
    padding: 10px 24px;
    border-radius: 30px;
    font-size: 0.8rem;
    font-weight: 700;
    display: none;
    z-index: 100;
    box-shadow: 0 4px 24px rgba(83,215,105,0.3);
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-50%) translateY(16px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  footer {
    text-align: center;
    font-size: 0.55rem;
    color: var(--muted);
    opacity: 0.4;
    padding-top: 8px;
  }
</style>
</head>
<body>

<div class="wrapper">
  <h1>💰 Budget Familial</h1>
  <p class="sub">CCF — CENTRE NERVEUX</p>

  <div class="diagram-wrap">
    <svg viewBox="0 0 440 480" id="diagram" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#6a6a8a" />
        </marker>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="ccfGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#2a3a7a"/>
          <stop offset="100%" stop-color="#16215a"/>
        </radialGradient>
        <radialGradient id="epargneGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1a7a72"/>
          <stop offset="100%" stop-color="#0f4a44"/>
        </radialGradient>
      </defs>

      <!-- FLECHES + ÉTIQUETTES (rendues par JS) -->
      <g id="arrows-layer"></g>
      <g id="labels-layer"></g>

      <!-- BULLES (rendues par JS) -->
      <g id="bubbles-layer"></g>

      <!-- CCF (rendu par JS car centré dynamiquement) -->
      <g id="ccf-layer"></g>
    </svg>
  </div>

  <!-- RÉSUMÉ -->
  <div class="edit-toggle" id="edit-toggle">✏️ Modifier les montants</div>

  <div class="edit-panel" id="edit-panel">
    <h3>Revenus</h3>
    <div class="edit-row">
      <div class="edit-group"><label>Salaire Mr (€)</label><input type="number" id="e-mr" value="2500"></div>
      <div class="edit-group"><label>Salaire Mme (€)</label><input type="number" id="e-mme" value="1800"></div>
      <div class="edit-group"><label>CAF (€)</label><input type="number" id="e-caf" value="860"></div>
      <div class="edit-group"><label>Charges fixes (€)</label><input type="number" id="e-charges" value="1100"></div>
    </div>
    <h3>Dispatch</h3>
    <div class="edit-row">
      <div class="edit-group"><label>Hayette (€)</label><input type="number" id="e-hayette" value="260"></div>
      <div class="edit-group"><label>Rachid (€)</label><input type="number" id="e-rachid" value="100"></div>
      <div class="edit-group"><label>Vie Courante (€)</label><input type="number" id="e-viecourante" value="2000"></div>
      <div class="edit-group"><label>Amine (€)</label><input type="number" id="e-amine" value="35"></div>
      <div class="edit-group"><label>Mayssa (€)</label><input type="number" id="e-mayssa" value="35"></div>
      <div class="edit-group"><label>Assiya (€)</label><input type="number" id="e-assiya" value="35"></div>
    </div>
    <button class="edit-save" id="edit-save">💾 Enregistrer</button>
  </div>

  <footer>Budget Familial · Données sauvegardées automatiquement</footer>
</div>

<div class="toast" id="toast">✅ Mis à jour !</div>

<script>
(function() {
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CX = 220, CY = 195; // centre CCF

  // Définition des comptes: [id, label, desc, montant défaut, couleur, angle (degrés), distance du centre, rayon bulle]
  const ACCOUNTS = [
    {id:'hayette',  label:'Hayette',  desc:'Bourso',    def:260, color:'#fd79a8', angle:200, dist:140, r:30},
    {id:'rachid',   label:'Rachid',   desc:'Bourso',    def:100, color:'#54a0ff', angle:160, dist:140, r:28},
    {id:'vie',      label:'Vie Courante', desc:'Bourso', def:2000,color:'#53d769', angle:270, dist:145, r:42},
    {id:'amine',    label:'Amine',    desc:'Bourso',    def:35,  color:'#ffa502', angle:60,  dist:130, r:24},
    {id:'mayssa',   label:'Mayssa',   desc:'Bourso',    def:35,  color:'#a29bfe', angle:0,   dist:130, r:24},
    {id:'assiya',   label:'Assiya',   desc:'Bourso',    def:35,  color:'#fd79a8', angle:320, dist:130, r:24},
    {id:'epargne',  label:'Épargne',  desc:'Bourso',    def:0,   color:'#0fb9b1', angle:100, dist:150, r:38},
  ];

  function deg2rad(d) { return d * Math.PI / 180; }

  function getData() {
    const v = id => parseInt(document.getElementById('e-'+id).value) || 0;
    return {
      mr: v('mr'), mme: v('mme'), caf: v('caf'),
      charges: v('charges'),
      hayette: v('hayette'), rachid: v('rachid'), vie: v('vie'),
      amine: v('amine'), mayssa: v('mayssa'), assiya: v('assiya'),
    };
  }

  function saveData(d) {
    try { localStorage.setItem('bf-data', JSON.stringify(d)); } catch(e) {}
  }
  function loadData() {
    try {
      const r = localStorage.getItem('bf-data');
      if (r) return JSON.parse(r);
    } catch(e) {}
    return null;
  }

  function render(d) {
    if (!d) d = getData();
    const totalRev = d.mr + d.mme + d.caf;
    const resteDispatch = totalRev - d.charges;

    const dispatch = [
      {id:'hayette', v:d.hayette}, {id:'rachid', v:d.rachid},
      {id:'vie', v:d.vie}, {id:'amine', v:d.amine},
      {id:'mayssa', v:d.mayssa}, {id:'assiya', v:d.assiya},
    ];
    const totalDispatch = dispatch.reduce((s,x) => s + x.v, 0);
    const epargne = resteDispatch - totalDispatch;

    // Calculer les bulles
    const bubbles = ACCOUNTS.map(a => {
      let v = a.id === 'epargne' ? epargne : (dispatch.find(x => x.id === a.id)?.v || 0);
      const rad = deg2rad(a.angle);
      const x = CX + Math.cos(rad) * a.dist;
      const y = CY + Math.sin(rad) * a.dist;
      // taille proportionnelle
      let r = a.r;
      // épargne dynamic
      if (a.id === 'epargne') {
        const ratio = Math.min(Math.max(epargne / 500, 0.5), 3);
        r = Math.round(28 + ratio * 10);
      }
      return {...a, v, x, y, r};
    });

    // LAYER CCF
    const ccfLayer = document.getElementById('ccf-layer');
    ccfLayer.innerHTML = '';

    // Glow
    const glow = document.createElementNS(SVG_NS, 'circle');
    glow.setAttribute('cx', CX); glow.setAttribute('cy', CY);
    glow.setAttribute('r', 62);
    glow.setAttribute('class', 'ccf-glow');
    glow.setAttribute('filter', 'url(#glow)');
    ccfLayer.appendChild(glow);

    // Cercle CCF
    const ccfCirc = document.createElementNS(SVG_NS, 'circle');
    ccfCirc.setAttribute('cx', CX); ccfCirc.setAttribute('cy', CY);
    ccfCirc.setAttribute('r', 52);
    ccfCirc.setAttribute('fill', 'url(#ccfGrad)');
    ccfCirc.setAttribute('stroke', '#54a0ff');
    ccfCirc.setAttribute('stroke-width', '2.5');
    ccfLayer.appendChild(ccfCirc);

    // Texte CCF
    const texts = [
      {t:'CCF', y:-20, fs:14, fw:800, fill:'#54a0ff'},
      {t:'Centre Nerveux', y:-6, fs:7, fw:500, fill:'#6a6a8a'},
      {t:'+'+d.mr.toLocaleString('fr-FR')+'€', y:8, fs:9, fw:700, fill:'#53d769'},
      {t:'+'+d.mme.toLocaleString('fr-FR')+'€', y:20, fs:9, fw:700, fill:'#53d769'},
      {t:'+'+d.caf.toLocaleString('fr-FR')+'€', y:32, fs:9, fw:700, fill:'#53d769'},
    ];
    texts.forEach(t => {
      const el = document.createElementNS(SVG_NS, 'text');
      el.setAttribute('x', CX);
      el.setAttribute('y', CY + t.y);
      el.setAttribute('text-anchor', 'middle');
      el.setAttribute('font-size', t.fs);
      el.setAttribute('font-weight', t.fw);
      el.setAttribute('fill', t.fill);
      if (t.y < 0) el.setAttribute('dominant-baseline', 'auto');
      else el.setAttribute('dominant-baseline', 'hanging');
      el.textContent = t.t;
      ccfLayer.appendChild(el);
    });

    // Charges fixes
    const chargesY = CY + 48;
    const chargesLine = document.createElementNS(SVG_NS, 'text');
    chargesLine.setAttribute('x', CX); chargesLine.setAttribute('y', chargesY);
    chargesLine.setAttribute('text-anchor', 'middle');
    chargesLine.setAttribute('font-size', '8');
    chargesLine.setAttribute('fill', '#ff6b81');
    chargesLine.setAttribute('font-weight', '600');
    chargesLine.setAttribute('dominant-baseline', 'hanging');
    chargesLine.textContent = '🔒 −'+d.charges.toLocaleString('fr-FR')+'€ charges';
    ccfLayer.appendChild(chargesLine);

    // Reste à dispatcher
    const resteY = chargesY + 16;
    const resteText = document.createElementNS(SVG_NS, 'text');
    resteText.setAttribute('x', CX); resteText.setAttribute('y', resteY);
    resteText.setAttribute('text-anchor', 'middle');
    resteText.setAttribute('font-size', '11');
    resteText.setAttribute('fill', '#54a0ff');
    resteText.setAttribute('font-weight', '800');
    resteText.setAttribute('dominant-baseline', 'hanging');
    resteText.textContent = '↘ '+resteDispatch.toLocaleString('fr-FR')+'€ à dispatcher';
    ccfLayer.appendChild(resteText);

    // ARROWS + LABELS
    const arrowLayer = document.getElementById('arrows-layer');
    const labelLayer = document.getElementById('labels-layer');
    arrowLayer.innerHTML = '';
    labelLayer.innerHTML = '';

    bubbles.forEach(b => {
      if (b.v <= 0 && b.id !== 'epargne') return;
      if (b.id === 'epargne' && epargne <= 0) return;

      // Diriger la flèche vers le bord de la bulle cible
      const dx = b.x - CX, dy = b.y - CY;
      const angle = Math.atan2(dy, dx);
      const startR = 58;
      const endR = b.r + 6;
      const x1 = CX + Math.cos(angle) * startR;
      const y1 = CY + Math.sin(angle) * startR;
      const x2 = b.x - Math.cos(angle) * endR;
      const y2 = b.y - Math.sin(angle) * endR;

      // Flèche courbe? Non, droite pour lisibilité
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('class', 'flow-arrow');
      line.setAttribute('stroke', b.color);
      line.setAttribute('opacity', '0.5');
      arrowLayer.appendChild(line);

      // Label montant au milieu de la flèche
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2 - 8;
      const lbl = document.createElementNS(SVG_NS, 'text');
      lbl.setAttribute('x', mx); lbl.setAttribute('y', my);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('font-size', '9');
      lbl.setAttribute('fill', b.color);
      lbl.setAttribute('font-weight', '800');
      lbl.setAttribute('opacity', '0.85');
      lbl.textContent = b.v.toLocaleString('fr-FR')+'€';
      labelLayer.appendChild(lbl);
    });

    // BUBBLES
    const bubbleLayer = document.getElementById('bubbles-layer');
    bubbleLayer.innerHTML = '';

    bubbles.forEach(b => {
      if (b.v <= 0 && b.id !== 'epargne') return;
      if (b.id === 'epargne' && epargne <= 0) {
        // Afficher quand même avec "0€"
      }

      const g = document.createElementNS(SVG_NS, 'g');
      g.setAttribute('class', 'bubble');
      g.setAttribute('data-id', b.id);

      const gradId = b.id === 'epargne' ? 'url(#epargneGrad)' : b.color;

      // Cercle avec ombre
      const circle = document.createElementNS(SVG_NS, 'circle');
      circle.setAttribute('cx', b.x); circle.setAttribute('cy', b.y);
      circle.setAttribute('r', b.r);
      circle.setAttribute('fill', b.id === 'epargne' ? 'url(#epargneGrad)' : b.color);
      circle.setAttribute('stroke', b.color);
      circle.setAttribute('stroke-width', '2');
      circle.setAttribute('filter', 'url(#glow)');
      circle.setAttribute('opacity', '0.9');
      g.appendChild(circle);

      // Nom en haut de la bulle
      const name = document.createElementNS(SVG_NS, 'text');
      name.setAttribute('x', b.x);
      name.setAttribute('y', b.y - 2);
      name.setAttribute('text-anchor', 'middle');
      name.setAttribute('font-size', b.id === 'epargne' || b.id === 'vie' ? '8' : '8');
      name.setAttribute('font-weight', '700');
      name.setAttribute('fill', '#fff');
      name.setAttribute('dominant-baseline', 'auto');
      name.textContent = b.label;
      g.appendChild(name);

      // Montant
      const amt = document.createElementNS(SVG_NS, 'text');
      amt.setAttribute('x', b.x);
      amt.setAttribute('y', b.y + 4);
      amt.setAttribute('text-anchor', 'middle');
      amt.setAttribute('font-size', b.v >= 1000 ? '12' : b.v >= 100 ? '11' : '10');
      amt.setAttribute('font-weight', '800');
      amt.setAttribute('fill', '#fff');
      amt.setAttribute('dominant-baseline', 'hanging');
      amt.textContent = b.v.toLocaleString('fr-FR')+'€';
      g.appendChild(amt);

      // Description
      const desc = document.createElementNS(SVG_NS, 'text');
      desc.setAttribute('x', b.x);
      desc.setAttribute('y', b.y + b.r - 6);
      desc.setAttribute('text-anchor', 'middle');
      desc.setAttribute('font-size', '6.5');
      desc.setAttribute('fill', 'rgba(255,255,255,0.4)');
      desc.setAttribute('dominant-baseline', 'hanging');
      desc.textContent = b.desc;
      g.appendChild(desc);

      bubbleLayer.appendChild(g);
    });
  }

  // UI
  function applyData(d) {
    document.getElementById('e-mr').value = d.mr;
    document.getElementById('e-mme').value = d.mme;
    document.getElementById('e-caf').value = d.caf;
    document.getElementById('e-charges').value = d.charges;
    document.getElementById('e-hayette').value = d.hayette;
    document.getElementById('e-rachid').value = d.rachid;
    document.getElementById('e-viecourante').value = d.vie;
    document.getElementById('e-amine').value = d.amine;
    document.getElementById('e-mayssa').value = d.mayssa;
    document.getElementById('e-assiya').value = d.assiya;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg || '✅ Mis à jour !';
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
  }

  // INIT
  const saved = loadData();
  if (saved) {
    applyData(saved);
    render(saved);
  } else {
    render(getData());
  }

  // Live preview on input change
  document.querySelectorAll('.edit-panel input').forEach(inp => {
    inp.addEventListener('input', () => {
      const d = getData();
      render(d);
    });
  });

  // Toggle panel
  document.getElementById('edit-toggle').addEventListener('click', function() {
    const panel = document.getElementById('edit-panel');
    panel.classList.toggle('open');
    if (!panel.classList.contains('open')) {
      // On ferme, recharger les valeurs depuis les inputs
    }
  });

  // Save
  document.getElementById('edit-save').addEventListener('click', function() {
    const d = getData();
    saveData(d);
    render(d);
    document.getElementById('edit-panel').classList.remove('open');
    showToast('✅ Montants sauvegardés !');
  });
})();
</script>
</body>
</html>
