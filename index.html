<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Budget Familial — CCF</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d1f;
    --card: #16163a;
    --text: #e8e8f0;
    --muted: #6a6a8a;
    --blue: #54a0ff;
    --green: #53d769;
    --pink: #fd79a8;
    --orange: #ffa502;
    --purple: #a29bfe;
    --teal: #0fb9b1;
    --red: #ff6b81;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    width: 100%;
    overflow-x: hidden;
  }
  .wrap {
    max-width: 500px;
    margin: 0 auto;
    padding: 12px 10px 32px;
  }

  h1 {
    font-size: 1.1rem;
    text-align: center;
    background: linear-gradient(90deg, var(--blue), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    text-align: center;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 92vw;
    margin: 0 auto;
  }

  .ctrl {
    display: block;
    width: 100%;
    padding: 13px;
    background: var(--card);
    border: 1px dashed rgba(255,255,255,0.12);
    border-radius: 14px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    margin-top: 8px;
  }
  .ctrl:hover {
    border-color: var(--blue);
    color: var(--blue);
  }

  .panel {
    display: none;
    background: var(--card);
    border-radius: 18px;
    padding: 16px;
    margin-top: 8px;
    animation: slide .3s ease;
  }
  .panel.open { display: block; }
  @keyframes slide {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .panel h3 {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
    margin-top: 12px;
  }
  .panel h3:first-child { margin-top: 0; }
  .grp {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 8px;
  }
  .grp label {
    display: block;
    font-size: 0.6rem;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .grp input {
    width: 100%;
    padding: 9px 10px;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.85rem;
    outline: none;
  }
  .grp input:focus { border-color: var(--blue); }

  .save {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  .save:active { opacity: .8; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--green);
    color: #000;
    padding: 10px 24px;
    border-radius: 30px;
    font-size: .8rem;
    font-weight: 700;
    display: none;
    z-index: 100;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-50%) translateY(16px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  footer {
    text-align: center;
    font-size: .55rem;
    color: var(--muted);
    opacity: .4;
    padding-top: 10px;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>💰 Budget Familial</h1>
  <p class="sub">CCF · CENTRE NERVEUX</p>

  <svg viewBox="0 0 420 460" id="d">
    <defs>
      <radialGradient id="cg" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#2a3a7a"/>
        <stop offset="100%" stop-color="#14184a"/>
      </radialGradient>
      <radialGradient id="eg" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1a7a72"/>
        <stop offset="100%" stop-color="#0f4a44"/>
      </radialGradient>
    </defs>

    <!-- GLOW CCF -->
    <circle cx="210" cy="180" r="70" fill="none" stroke="#54a0ff" stroke-width="1" opacity="0.15"/>

    <!-- CCF -->
    <circle cx="210" cy="180" r="58" fill="url(#cg)" stroke="#54a0ff" stroke-width="2.5"/>

    <!-- Revenus CCF -->
    <text x="210" y="142" text-anchor="middle" font-size="14" font-weight="800" fill="#54a0ff" dominant-baseline="auto">CCF</text>
    <text x="210" y="154" text-anchor="middle" font-size="6.5" fill="#6a6a8a" dominant-baseline="hanging">Centre Nerveux</text>

    <text x="210" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#53d769" dominant-baseline="hanging" id="r1">+2 500€</text>
    <text x="210" y="186" text-anchor="middle" font-size="9" font-weight="700" fill="#53d769" dominant-baseline="hanging" id="r2">+1 800€</text>
    <text x="210" y="198" text-anchor="middle" font-size="9" font-weight="700" fill="#53d769" dominant-baseline="hanging" id="r3">+860€</text>

    <!-- Charges fixes -->
    <text x="210" y="227" text-anchor="middle" font-size="8" font-weight="600" fill="#ff6b81" dominant-baseline="hanging" id="r4">🔒 −1 100€ charges</text>

    <!-- Reste à dispatcher -->
    <text x="210" y="244" text-anchor="middle" font-size="10" font-weight="800" fill="#54a0ff" dominant-baseline="hanging" id="r5">↘ 4 060€ à dispatcher</text>

    <!-- FLECHES + BULLES (générées par JS) -->
    <g id="arrows"></g>
    <g id="bubbles"></g>
  </svg>

  <button class="ctrl" id="editBtn">✏️ Modifier les montants</button>

  <div class="panel" id="panel">
    <h3>Revenus</h3>
    <div class="grp">
      <div><label>Salaire Mr (€)</label><input type="number" id="i-mr" value="2500"></div>
      <div><label>Salaire Mme (€)</label><input type="number" id="i-mme" value="1800"></div>
      <div><label>CAF (€)</label><input type="number" id="i-caf" value="860"></div>
      <div><label>Charges (€)</label><input type="number" id="i-charges" value="1100"></div>
    </div>
    <h3>Dispatch</h3>
    <div class="grp">
      <div><label>Hayette (€)</label><input type="number" id="i-hayette" value="260"></div>
      <div><label>Rachid (€)</label><input type="number" id="i-rachid" value="100"></div>
      <div><label>Vie Courante (€)</label><input type="number" id="i-vie" value="2000"></div>
      <div><label>Amine (€)</label><input type="number" id="i-amine" value="35"></div>
      <div><label>Mayssa (€)</label><input type="number" id="i-mayssa" value="35"></div>
      <div><label>Assiya (€)</label><input type="number" id="i-assiya" value="35"></div>
    </div>
    <button class="save" id="saveBtn">💾 Enregistrer</button>
  </div>

  <footer>Budget Familial · Données sauvegardées</footer>
</div>

<div class="toast" id="toast">✅ Mis à jour !</div>

<script>
(function() {
  const NS = 'http://www.w3.org/2000/svg';
  const CX = 210, CY = 180;

  const CFG = [
    {id:'hayette', label:'Hayette',    color:'#fd79a8', deg:205, dist:140, r:28},
    {id:'rachid',  label:'Rachid',     color:'#54a0ff', deg:155, dist:140, r:26},
    {id:'vie',     label:'Vie Courante', color:'#53d769', deg:275, dist:145, r:40},
    {id:'amine',   label:'Amine',      color:'#ffa502', deg:55,  dist:130, r:22},
    {id:'mayssa',  label:'Mayssa',     color:'#a29bfe', deg:360, dist:130, r:22},
    {id:'assiya',  label:'Assiya',     color:'#fd79a8', deg:325, dist:130, r:22},
    {id:'epargne', label:'Épargne',    color:'#0fb9b1', deg:95,  dist:150, r:34, grad:'url(#eg)'},
  ];

  function deg(d) { return d * Math.PI / 180; }

  function getData() {
    const g = id => parseInt(document.getElementById('i-'+id).value) || 0;
    return {
      mr: g('mr'), mme: g('mme'), caf: g('caf'), charges: g('charges'),
      hayette: g('hayette'), rachid: g('rachid'), vie: g('vie'),
      amine: g('amine'), mayssa: g('mayssa'), assiya: g('assiya'),
    };
  }

  function save(d) { try{localStorage.setItem('bf',JSON.stringify(d))}catch(e){} }
  function load() { try{var r=localStorage.getItem('bf');if(r)return JSON.parse(r)}catch(e){}return null }

  function fmt(n) { return n.toLocaleString('fr-FR')+'€'; }

  function render(d) {
    if (!d) d = getData();
    var rev = d.mr + d.mme + d.caf;
    var reste = rev - d.charges;

    var dispatch = [
      d.hayette, d.rachid, d.vie, d.amine, d.mayssa, d.assiya
    ];
    var totalDisp = dispatch.reduce(function(a,b){return a+b},0);
    var epargne = reste - totalDisp;

    // Mise à jour texte CCF
    document.getElementById('r1').textContent = '+'+fmt(d.mr);
    document.getElementById('r2').textContent = '+'+fmt(d.mme);
    document.getElementById('r3').textContent = '+'+fmt(d.caf);
    document.getElementById('r4').textContent = '🔒 −'+fmt(d.charges)+' charges';
    document.getElementById('r5').textContent = '↘ '+fmt(reste)+' à dispatcher';

    var vals = {hayette:d.hayette, rachid:d.rachid, vie:d.vie, amine:d.amine, mayssa:d.mayssa, assiya:d.assiya, epargne:epargne};

    // Flèches
    var arrowG = document.getElementById('arrows');
    arrowG.innerHTML = '';

    // Bulles
    var bubG = document.getElementById('bubbles');
    bubG.innerHTML = '';

    CFG.forEach(function(c) {
      var v = vals[c.id];
      if (v < 0) v = 0;
      var rad = deg(c.deg);
      var x = CX + Math.cos(rad) * c.dist;
      var y = CY + Math.sin(rad) * c.dist;
      var r = c.r;
      if (c.id === 'epargne') {
        // ajuster la taille selon le montant
        var ratio = Math.min(Math.max(epargne/300, 0.6), 3);
        r = Math.round(26 + ratio * 10);
      }

      // Flèche
      var dx = x - CX, dy = y - CY;
      var a = Math.atan2(dy, dx);
      var x1 = CX + Math.cos(a) * 62;
      var y1 = CY + Math.sin(a) * 62;
      var x2 = x - Math.cos(a) * (r + 5);
      var y2 = y - Math.sin(a) * (r + 5);

      var line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke', c.color);
      line.setAttribute('stroke-width', '1.5');
      line.setAttribute('opacity', '0.4');
      arrowG.appendChild(line);

      // Label flèche
      var mx = (x1+x2)/2;
      var my = (y1+y2)/2 - 7;
      var lbl = document.createElementNS(NS, 'text');
      lbl.setAttribute('x', mx);
      lbl.setAttribute('y', my);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('font-size', '8');
      lbl.setAttribute('font-weight', '800');
      lbl.setAttribute('fill', c.color);
      lbl.setAttribute('opacity', '0.85');
      lbl.textContent = v.toLocaleString('fr-FR')+'€';
      arrowG.appendChild(lbl);

      // Bulle
      var g = document.createElementNS(NS, 'g');
      var fill = c.grad || c.color;

      var circ = document.createElementNS(NS, 'circle');
      circ.setAttribute('cx', x);
      circ.setAttribute('cy', y);
      circ.setAttribute('r', r);
      circ.setAttribute('fill', fill);
      circ.setAttribute('stroke', c.color);
      circ.setAttribute('stroke-width', '2');
      circ.setAttribute('opacity', '0.92');
      g.appendChild(circ);

      // Nom (en haut de la bulle)
      var name = document.createElementNS(NS, 'text');
      name.setAttribute('x', x);
      name.setAttribute('y', y - 1);
      name.setAttribute('text-anchor', 'middle');
      name.setAttribute('font-size', c.id === 'epargne' || c.id === 'vie' ? '8' : '7.5');
      name.setAttribute('font-weight', '700');
      name.setAttribute('fill', '#fff');
      name.setAttribute('dominant-baseline', 'auto');
      name.textContent = c.label;
      g.appendChild(name);

      // Montant
      var amt = document.createElementNS(NS, 'text');
      amt.setAttribute('x', x);
      amt.setAttribute('y', y + 4);
      amt.setAttribute('text-anchor', 'middle');
      var sz = '10';
      if (v >= 1000) sz = '12';
      else if (v >= 100) sz = '11';
      amt.setAttribute('font-size', sz);
      amt.setAttribute('font-weight', '800');
      amt.setAttribute('fill', '#fff');
      amt.setAttribute('dominant-baseline', 'hanging');
      amt.textContent = v.toLocaleString('fr-FR')+'€';
      g.appendChild(amt);

      // Description (bas de la bulle)
      if (r > 18) {
        var desc = document.createElementNS(NS, 'text');
        desc.setAttribute('x', x);
        desc.setAttribute('y', y + r - 5);
        desc.setAttribute('text-anchor', 'middle');
        desc.setAttribute('font-size', '6');
        desc.setAttribute('fill', 'rgba(255,255,255,0.35)');
        desc.setAttribute('dominant-baseline', 'hanging');
        desc.textContent = 'Bourso';
        g.appendChild(desc);
      }

      bubG.appendChild(g);
    });
  }

  // Init
  var saved = load();
  if (saved) {
    Object.keys(saved).forEach(function(k) {
      var el = document.getElementById('i-'+k);
      if (el) el.value = saved[k];
    });
    render(saved);
  } else {
    render(getData());
  }

  // Live preview
  document.querySelectorAll('.panel input').forEach(function(inp) {
    inp.addEventListener('input', function() {
      render(getData());
    });
  });

  // Toggle panel
  document.getElementById('editBtn').addEventListener('click', function() {
    document.getElementById('panel').classList.toggle('open');
  });

  // Save
  document.getElementById('saveBtn').addEventListener('click', function() {
    var d = getData();
    save(d);
    render(d);
    document.getElementById('panel').classList.remove('open');
    var t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(function(){t.style.display='none'}, 2000);
  });
})();
</script>
</body>
</html>
